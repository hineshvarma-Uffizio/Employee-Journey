<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich 24k Antique Gold Metallic Gradient -->
    <linearGradient id="goldBase_tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1B8" />
      <stop offset="18%" stop-color="#F5AD05" />
      <stop offset="42%" stop-color="#FFCA38" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="88%" stop-color="#A53E0C" />
      <stop offset="100%" stop-color="#682001" />
    </linearGradient>

    <!-- Specular Highlight Sheen -->
    <linearGradient id="goldLustre_tr" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A3505" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#F5AD05" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#F5AD05" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#521800" stop-opacity="0.8" />
    </linearGradient>

    <radialGradient id="embossGlow_tr" cx="12%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#FFFBEA" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#F5AD05" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#A53E0C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#360F00" stop-opacity="0" />
    </radialGradient>

    <filter id="cornerShadow_tr" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(64, 0) scale(-1, 1)" filter="url(#cornerShadow_tr)">
    <!-- Outer Heavy Brass Bracket Base Plate -->
    <!-- (0,0) -> (64,0) -> bevel to (60,4) -> Scallop 1 -> Cusp (37,37) -> Scallop 2 -> bevel (4,60) -> (0,64) -> (0,0) -->
    <path d="M 0,0 L 64,0 L 60,4.5 C 47,7.5 39,17.5 37,37 C 17.5,39 7.5,47 4.5,60 L 0,64 Z"
          fill="url(#goldBase_tr)"
          stroke="#501A02"
          stroke-width="0.6" />

    <!-- Specular Highlight Overlay -->
    <path d="M 0,0 L 64,0 L 60,4.5 C 47,7.5 39,17.5 37,37 C 17.5,39 7.5,47 4.5,60 L 0,64 Z"
          fill="url(#goldLustre_tr)"
          mix-blend-mode="screen" />

    <!-- Radial Corner Glow for Volume / Depth -->
    <path d="M 0,0 L 64,0 L 60,4.5 C 47,7.5 39,17.5 37,37 C 17.5,39 7.5,47 4.5,60 L 0,64 Z"
          fill="url(#embossGlow_tr)" />

    <!-- Outer Top/Left Chamfer Bevel Highlight -->
    <path d="M 0,0 L 64,0 L 60,4.5 M 0,0 L 0,64 L 4.5,60"
          stroke="#FFF8D6"
          stroke-width="0.85"
          fill="none" />

    <!-- Inner Scallop Edge Shadow (Deep Engraved Chisel) -->
    <path d="M 60,4.5 C 47,7.5 39,17.5 37,37 C 17.5,39 7.5,47 4.5,60"
          stroke="#421300"
          stroke-width="1.1"
          stroke-linecap="round"
          fill="none" />
    <path d="M 59,5.5 C 46.5,8.2 38.8,17.8 37,36.5 C 17.8,38.8 8.2,46.5 5.5,59"
          stroke="#FFF1BA"
          stroke-width="0.5"
          fill="none" />

    <!-- Inner Stepped Frame Line -->
    <path d="M 4,4 L 56,4 L 53,6.5 C 42,9.5 35,18.5 33,33 C 18.5,35 9.5,42 6.5,53 L 4,56 Z"
          fill="none"
          stroke="#541B01"
          stroke-width="0.7" />
    <path d="M 5,5 L 54,5 L 51.5,7 C 41,10 34.5,19 32.5,32.5 C 19,34.5 10,41 7,51.5 L 5,54 Z"
          fill="none"
          stroke="#FFEC9E"
          stroke-width="0.5" />

    <!-- Filigree Engravings (Vintage Bookplate Arabesque / Acanthus Scrolls) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Shadow pass for deep engraving -->
      <g stroke="#521B02" stroke-width="0.8">
        <!-- Central Diagonal Spine -->
        <path d="M 5,5 Q 18,18 31,31" />
        <!-- Top Leaf Branch -->
        <path d="M 12,7 C 20,8 30,11 36,17 C 40,21 43,28 46,24 C 48,20 44,15 37,12 C 29,9 19,6 12,6" />
        <path d="M 23,9 C 30,11 37,14 39,19 C 40,22 37,24 35,21 C 32,17 27,13 22,10" />
        <!-- Bottom Leaf Branch -->
        <path d="M 7,12 C 8,20 11,30 17,36 C 21,40 28,43 24,46 C 20,48 15,44 12,37 C 9,29 6,19 6,12" />
        <path d="M 9,23 C 11,30 14,37 19,39 C 22,40 24,37 21,35 C 17,32 13,27 10,22" />
        <!-- Acanthus Central Rosette Curls -->
        <path d="M 15,15 C 20,11 26,11 29,14 C 32,17 30,22 26,21 C 22,20 21,16 24,14" />
        <path d="M 15,15 C 11,20 11,26 14,29 C 17,32 22,30 21,26 C 20,22 16,21 14,24" />
        <!-- Outer Tendril Flourishes -->
        <path d="M 43,5 Q 47,9 50,7" />
        <path d="M 5,43 Q 9,47 7,50" />
      </g>

      <!-- Golden Highlight pass for embossed 3D relief -->
      <g stroke="#FFF4BA" stroke-width="0.45">
        <path d="M 5.5,4.5 Q 18.5,17.5 31.5,30.5" />
        <path d="M 12,5.5 C 19,6.5 29,9.5 35,15.5 C 39,19.5 42,26.5 45,22.5" />
        <path d="M 5.5,12 C 6.5,19 9.5,29 15.5,35 C 19.5,39 26.5,42 22.5,45" />
        <path d="M 15,14 C 19.5,10.5 25,10.5 28,13.5" />
        <path d="M 14,15 C 10.5,19.5 10.5,25 13.5,28" />
      </g>
    </g>

    <!-- Jewels / Rivet Studs -->
    <circle cx="14.5" cy="14.5" r="1.8" fill="#FFFDE6" stroke="#4A1600" stroke-width="0.6" />
    <circle cx="24" cy="8.5" r="1.1" fill="#FFE899" stroke="#4A1600" stroke-width="0.5" />
    <circle cx="8.5" cy="24" r="1.1" fill="#FFE899" stroke="#4A1600" stroke-width="0.5" />
    <circle cx="32" cy="32" r="1.3" fill="#FFFDE6" stroke="#4A1600" stroke-width="0.5" />
  </g>
</svg>